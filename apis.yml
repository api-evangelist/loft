name: Loft
description: Loft is a Brazilian real estate technology (proptech) company founded in 2018 and headquartered
  in Sao Paulo. It operates a marketplace for buying, selling, and renting residential property alongside
  a broad platform of software and financial services for the real estate sector, including a CRM and
  property-management tools for agencies, digital proposals and e-signatures, lead generation, rental
  administration, and fintech products such as rental guarantees (Fianca Aluguel), home financing, credit
  with property collateral, and residential and commercial insurance. Backed by a16z, QED Investors,
  Fifth Wall, D1 Capital, Thrive Capital, and Baillie Gifford, Loft is a market leader in Brazil's real
  estate fintech space. Loft does not publish a public developer API, OpenAPI definitions, or client SDKs;
  its GitHub organization (loft-br) hosts internal engineering and data-science tooling.
